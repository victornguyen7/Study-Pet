<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: light dark; }
      body { width: 340px; margin: 12px; font: 14px/1.4 system-ui, sans-serif; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      h2 { font-size: 13px; margin: 12px 0 4px; }
      p { margin: 0; opacity: 0.75; }
      ul { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
      li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
      li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      select, button { font: inherit; }
    </style>
  </head>
  <body>
    <h1>Study Pet</h1>
    <p id="status" role="status"></p>
    <h2>Sites you have answered</h2>
    <ul id="sites"></ul>
    <script src="popup.js"></script>
  </body>
</html>
